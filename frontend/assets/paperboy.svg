<title id="title">Goniec z Wiejskiej — przy furtce</title>
<desc id="desc">Chłopak w kaszkiecie podaje gazetę mieszkańcowi stojącemu przy drewnianej furtce. Rower z torbą czeka przy drodze. Za płotem dom, sad i pasy pól.</desc>
